<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Contacts | Greenair</title><style>body{font:16px system-ui;background:#f3f6f4;color:#173a29;margin:0}main{max-width:760px;margin:20px auto;padding:16px}.card{background:white;padding:20px;border-radius:12px;margin:12px 0}button,.link{background:#176b45;color:white;border:0;border-radius:7px;padding:12px;cursor:pointer}label.contact{display:block;padding:12px;border-bottom:1px solid #ddd}a{color:#176b45}</style></head><body><main><a href="/r/customer">← Customers</a><h1>Import selected phone contacts</h1><div class="card"><p>Choose only the contacts you want. Nothing is saved until you review and approve.</p><button id="pick" type="button">Select phone contacts</button><p>Or select a .vcf contact export:</p><input id="vcf" type="file" accept=".vcf,text/vcard,text/x-vcard"><p id="status" role="status"></p></div><div class="card"><h2>Review contacts</h2><div id="review">No contacts selected.</div><p><button id="save" disabled>Import checked contacts</button></p></div></main><script src="/contact-import.js"></script></body></html>
